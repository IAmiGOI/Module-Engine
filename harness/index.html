<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ST Module Engine — Beta harness</title>
<link rel="stylesheet" href="panel.css">
<style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.4 system-ui, sans-serif; max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 16px; opacity: .7; font-weight: normal; }
    /* Полоска только для харнесса: в настоящем ST события ST приходят сами,
       а здесь их нужно чем-то сыграть. В сам экран движка она не входит. */
    .harness-strip { display: flex; gap: 8px; align-items: center; margin: 12px 0 20px; padding: 10px 12px; border: 1px dashed #8886; border-radius: 10px; font-size: 12px; }
    .harness-strip select, .harness-strip button { font: inherit; padding: 3px 8px; }
    #chat { max-width: 1200px; margin: 0 auto 20px; padding: 0 16px; }
    #chat .mes { padding: 10px 0; border-top: 1px solid #8883; }
    #chat .mes_text { opacity: .85; line-height: 1.5; }
</style>
</head>
<body>
<h1>ST Module Engine — Beta harness</h1>
<div class="harness-strip">
    <span>Play a SillyTavern event:</span>
    <select id="harnessEvent"></select>
    <button id="harnessFire" type="button">Fire</button>
    <span id="harnessLast"></span>
</div>
<div class="harness-strip">
    <span>Play a whole generation (interceptor → send):</span>
    <button id="harnessGenerate" type="button">Generate</button>
    <span id="harnessGenerationResult"></span>
</div>
<!-- Разметка чата ТОЙ ЖЕ формы, что у настоящего ST (#chat > .mes[mesid] >
     is_user/is_system строками "true"/"false", как их и пишет ST: без них
     подвал считал бы репликой персонажа вообще всё, и отказ виджета от
     сообщения пользователя здесь было бы нечем проверить.
     .mes_block): без неё полосу под сообщением проверить нечем, а подделка
     другой формы проверяла бы не то. -->
<div class="harness-strip">
    <span>Chat:</span>
    <button id="harnessReroll" type="button">Reroll last message</button>
    <button id="harnessEditMsg" type="button">Edit last message</button>
    <span id="harnessFooterState"></span>
</div>
<div id="chat">
    <div class="mes" mesid="0" is_user="true" is_system="false"><div class="mes_block"><div class="mes_text">Player: I take a swing at the bandit.</div></div></div>
    <div class="mes" mesid="1" is_user="false" is_system="false"><div class="mes_block"><div class="mes_text">Narrator: The blade bites deep. You stagger back, bleeding.</div></div></div>
</div>
<!-- Chat Viewport (план `chat-viewport`) — живая проверка гибридного
     WebGL/DOM рендера. Канвас и зеркало-контейнер принадлежат харнессу
     (Ядро сам их не создаёт, только просят передать при attach()), кнопки
     ниже дёргают контракты Ядра напрямую через console-обвязку в main.js. -->
<div class="harness-strip">
    <span>Chat Viewport:</span>
    <button id="cvAttach" type="button">Attach</button>
    <button id="cvDetach" type="button">Detach</button>
    <button id="cvToggleEnabled" type="button">Toggle enabled</button>
    <button id="cvAddMessage" type="button">Add message</button>
    <button id="cvEditLast" type="button">Edit last</button>
    <button id="cvDeleteLast" type="button">Delete last</button>
    <button id="cvSwipeLast" type="button">Swipe last</button>
    <button id="cvRegenerate" type="button">Regenerate</button>
    <span id="cvState"></span>
</div>
<div id="stme-chat-viewport-host" style="position:relative; width:600px; height:300px; border:1px solid #8886; margin-bottom:20px; overflow:hidden;">
    <canvas id="stme-chat-viewport-canvas" width="600" height="300" style="position:absolute; inset:0;"></canvas>
    <div id="stme-chat-viewport-mirror" style="position:absolute; inset:0; overflow:hidden; visibility:hidden;"></div>
    <!-- Хром (widgets.js: MessageHeader/MessageActionsRow/ReasoningBlock) —
         реальный DOM поверх канваса. pointer-events:none на контейнере, auto
         на самих строках (panel.css) — иначе прозрачные промежутки между
         сообщениями перехватывали бы клики/скролл, предназначенные канвасу. -->
    <div id="stme-chat-viewport-chrome" style="position:absolute; inset:0; pointer-events:none;"></div>
</div>
<div id="app"></div>
<script type="module" src="main.js"></script>
</body>
</html>
