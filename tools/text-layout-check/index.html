<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Text layout check</title>
<!-- Тот же CSS зеркала, что на странице ST: эталон — настоящее зеркало, а не его копия. -->
<link rel="stylesheet" href="../../styles/chat-viewport/mirror-row.css">
<style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
    pre { white-space: pre-wrap; }
    /* Как глобальный style.css ST: у <q> нет автокавычек (кавычки уже в тексте). Без этого зеркало на этой странице шире, чем в ST. */
    q::before, q::after { content: ''; }
</style>
</head>
<body>
<h1>Text layout check</h1>
<p id="status">Loading fonts…</p>
<pre id="report"></pre>
<div class="stme-chat-viewport-mirror-host" id="host"></div>
<script type="module">
import { runLayoutCheck } from './check.js';
import { SYNTHETIC, buildRoleplayCorpus, DEFAULT_WIDTHS } from './corpus.js';

// Шрифт темы ST — Noto Sans, веб-шрифтом. `?fonts=<база>` — откуда брать woff2 (по умолчанию jsDelivr, @fontsource).
const params = new URLSearchParams(location.search);
const base = params.get('fonts') ?? 'https://cdn.jsdelivr.net/npm/@fontsource/noto-sans@5.1.0/files';
const faces = [];
for (const subset of ['latin', 'cyrillic']) {
    for (const [weight, style] of [[400, 'normal'], [700, 'normal'], [400, 'italic'], [700, 'italic']]) {
        const range = subset === 'latin' ? 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD' : 'U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116';
        faces.push(new FontFace('Noto Sans', `url(${base}/noto-sans-${subset}-${weight}-${style}.woff2)`, { weight: String(weight), style, unicodeRange: range }));
    }
}
const status = document.getElementById('status');
try {
    await Promise.all(faces.map(face => face.load().then(loaded => document.fonts.add(loaded))));
} catch (error) {
    status.textContent = `Font load failed: ${error.message}`;
}
const theme = { fontFamily: '"Noto Sans", sans-serif', fontSize: 15, lineHeight: 1.4, blockGap: 10 };
const widths = params.get('widths') ? params.get('widths').split(',').map(Number) : DEFAULT_WIDTHS;
const samples = [...SYNTHETIC, ...buildRoleplayCorpus({ count: Number(params.get('count') ?? 60) })];
status.textContent = 'Running…';
const report = await runLayoutCheck({ samples, widths, theme, host: document.getElementById('host'), onProgress: (done, total) => { status.textContent = `Running… ${done}/${total}`; } });
status.textContent = 'Done';
document.getElementById('report').textContent = JSON.stringify(report, null, 2);
window.__layoutReport = report;
</script>
</body>
</html>
